<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Drinks - Teiko</title>

  <!-- SEO & Icons -->
  <link rel="icon" type="image/png" href="asset/favicon.png?v=2" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=34">
  <link rel="stylesheet" href="navbar.css?v=34">

  <!-- GSAP & Lenis Smooth Scrolling -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <style>
    body {
      background-color: #ffffff;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.page-loaded { opacity: 1; }

    /* Stagger animation */
    .anim-item {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .anim-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .page-title-section { padding: 40px 0 30px; text-align: center; }

    .drink-card {
      background: transparent;
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      height: 100%;
      border: none;
      box-shadow: none;
      text-align: center;
    }

    .drink-card:hover {
      transform: translateY(-8px);
      box-shadow: none;
    }

    .drink-img-wrapper {
      width: 100%;
      aspect-ratio: 1/1;
      overflow: hidden;
      background: transparent;
    }

    .drink-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drink-info {
      padding: 15px 10px;
      text-align: center;
    }

    .drink-name {
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 5px;
      color: #111111;
      text-align: center;
    }

    .drink-price {
      font-weight: 600;
      color: #444;
      margin-top: 10px;
      text-align: center;
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Category Filter */
    .category-filter-container {
      background-color: #ffffff;
      border: none;
      border-radius: 50px;
      display: inline-flex;
      gap: 12px;
      padding: 6px;
      overflow-x: auto;
      max-width: 100%;
      white-space: nowrap;
      box-shadow: none;
    }

    /* Sembunyikan scrollbar untuk filter */
    .category-filter-container::-webkit-scrollbar {
      display: none;
    }

    .category-filter-container {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .category-btn {
      border: none;
      outline: none;
      background: transparent;
      padding: 10px 30px;
      border-radius: 50px;
      font-weight: 500;
      color: #333;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .category-btn.active {
      background-color: #111111;
      color: white;
      font-weight: 600;
      box-shadow: none;
      outline: none;
    }

    .category-btn:hover:not(.active) {
      background-color: #111111;
      color: white;
      font-weight: 600;
    }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

  <!-- Header/Navbar -->
  <header id="navbar-placeholder"></header>
  <div id="navbar-spacer"></div>

  <main class="container mb-5">
    <div class="page-title-section">
      <h6 class="text-uppercase text-secondary fw-bold" style="letter-spacing: 2px; font-size: 0.8rem;">Fresh & Tasty</h6>
      <h1 class="fw-bold h2">Our Menu</h1>
    </div>

    <!-- Category Filter -->
    <div class="d-flex justify-content-center mb-5 fade-up">
      <div class="category-filter-container">
        <button class="category-btn active" onclick="changeCategory(this, 'All')">All</button>
        <button class="category-btn" onclick="changeCategory(this, 'Tea')">Tea</button>
        <button class="category-btn" onclick="changeCategory(this, 'Chocolate')">Chocolate</button>
        <button class="category-btn" onclick="changeCategory(this, 'Milk')">Milk</button>
        <button class="category-btn" onclick="changeCategory(this, 'Coffee')">Coffee</button>
      </div>
    </div>

    <!-- Grid Minuman -->
    <div class="row g-4" id="drinks-container">
      <!-- Loading State -->
      <div class="col-6 col-md-4 col-lg-3">
        <div class="drink-card p-2 border-0">
          <div class="drink-img-wrapper rounded-4 skeleton"></div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="drink-card p-2 border-0">
          <div class="drink-img-wrapper rounded-4 skeleton"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="footer-placeholder"></footer>

  <!-- Scripts (Termasuk Lenis Smooth Scroll dari script.js) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>
  <script src="navbar.js" defer></script>
  <script src="footer.js" defer></script>

  <script>
    let allDrinks = [];

    async function loadDrinks() {
      const container = document.getElementById('drinks-container');
      try {
        const { data, error } = await sb.from('drinks').select('*').eq('is_active', true).order('created_at', { ascending: false });
        if (error) throw error;

        allDrinks = data || [];
        renderDrinks('All');
      } catch (err) {
        console.error('Error loading drinks:', err);
        container.innerHTML = `<div class="col-12 text-center text-danger">Gagal memuat menu. Silakan coba lagi nanti.</div>`;
      }
    }

    async function seedDefaultDrinksFrontend() {
      const defaultDrinks = [
        { name: 'Es Coklat Teiko Special', category: 'Chocolate', price: 'Rp 15.000', oz_size: '16 oz', image_url: './asset/hero3.png', detail: 'Paduan coklat pekat khas Belgia dengan susu segar dan krim manis yang lumer di mulut.', is_active: true },
        { name: 'Brown Sugar Boba Milk', category: 'Milk', price: 'Rp 18.000', oz_size: '16 oz', image_url: './asset/hero1.webp', detail: 'Susu segar lembut dipadukan dengan gula aren asli khas Teiko serta kenyalnya boba premium.', is_active: true },
        { name: 'Matcha Oat Latte', category: 'Tea', price: 'Rp 20.000', oz_size: '16 oz', image_url: './asset/dummy_matcha.png', detail: 'Teh hijau Uji Matcha pilihan bergaya Jepang dengan susu oat yang gurih dan menyehatkan.', is_active: true },
        { name: 'Belgian Choco Cream', category: 'Chocolate', price: 'Rp 18.000', oz_size: '16 oz', image_url: './asset/dummy_choco.png', detail: 'Cokelat Belgia autentik dengan lapisan krim kental bertekstur lembut dan rasa cokelat pekat.', is_active: true },
        { name: 'Teiko Coffee Cream Special', category: 'Coffee', price: 'Rp 18.000', oz_size: '16 oz', image_url: './asset/dummy_coffee.png', detail: 'Kopi espresso house-blend Teiko berpadu dengan susu kental lembut dan taburan bubuk kopi.', is_active: true },
        { name: 'Taro Creamy Milk', category: 'Milk', price: 'Rp 16.000', oz_size: '16 oz', image_url: './asset/dummy_taro.png', detail: 'Aroma talas (taro) yang harum manis menyatu sempurna dengan susu krim kental khas Teiko.', is_active: true },
        { name: 'Jasmine Green Tea Original', category: 'Tea', price: 'Rp 10.000', oz_size: '22 oz', image_url: './asset/hero1.webp', detail: 'Teh melati seduh segar alami yang harum, ringan, dan sangat menyegarkan untuk setiap waktu.', is_active: true },
        { name: 'Caramel Macchiato Teiko', category: 'Coffee', price: 'Rp 20.000', oz_size: '16 oz', image_url: './asset/dummy_coffee.png', detail: 'Espresso kaya rasa dengan sirup karamel legit dan lapisan busa susu yang lembut.', is_active: true }
      ];
      try {
        await sb.from('drinks').insert(defaultDrinks);
        loadDrinks();
      } catch (e) {
        console.error('Auto seed drinks error:', e);
      }
    }

    // staggerAnimate ada di script.js (dipakai bareng halaman lain)

    function renderDrinks(category) {
      const container = document.getElementById('drinks-container');
      let filtered = allDrinks;

      if (category !== 'All') {
        filtered = allDrinks.filter(drink => {
          if (drink.category && drink.category.toLowerCase() === category.toLowerCase()) return true;
          return drink.name.toLowerCase().includes(category.toLowerCase());
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Menu untuk kategori ini belum tersedia.</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(drink => `
        <div class="col-6 col-md-4 col-lg-3 anim-item">
          <div class="drink-card">
            <div class="drink-img-wrapper">
              <img src="${drink.image_url || './asset/hero1.webp'}" alt="${drink.name}" class="drink-img" loading="lazy">
            </div>
            <div class="drink-info text-center">
              <div class="drink-name">${drink.name}</div>
              ${drink.price ? `<div class="drink-price">${drink.price}</div>` : ''}
              ${drink.detail ? `<div class="drink-detail mt-2 text-muted" style="font-size: 0.85rem; line-height: 1.4;">${drink.detail.replace(/\n/g, '<br>')}</div>` : ''}
            </div>
          </div>
        </div>
      `).join('');

      // Stagger animate cards
      staggerAnimate('#drinks-container .anim-item', 60, 70);
    }

    function changeCategory(btn, category) {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDrinks(category);
    }

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('page-loaded'));
      // Animate page title
      setTimeout(() => document.querySelectorAll('.page-title-section, .category-filter-container').forEach(el => {
        el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        el.style.opacity = '0'; el.style.transform = 'translateY(20px)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.opacity = '1'; el.style.transform = 'translateY(0)';
        }));
      }), 50);
      loadDrinks();
    });
  </script>
</body>

</html>
