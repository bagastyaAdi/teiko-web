<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Menu Drinks - Teiko</title>

  <!-- SEO & Icons -->
  <link rel="icon" type="image/png" href="asset/favicon.png?v=2" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=45">
  <link rel="stylesheet" href="navbar.css?v=39">
  <link rel="stylesheet" href="theme.css?v=9">

  <!-- GSAP & Lenis Smooth Scrolling -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <style>
    body {
      background-color: #ffffff;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.page-loaded { opacity: 1; }

    /* Stagger animation */
    .anim-item {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .anim-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Kartu minuman: foto dalam lingkaran, nama tebal di tengah (gaya menu coffeehouse) */
    body { background: #F9F9F9 !important; }
    .menu-main { max-width: 1100px; margin: 0 auto; padding: 2.25rem 1.25rem 4rem; }
    /* Label kategori: kapital, kecil, abu (gaya "BETTER OPTIONS") */
    .menu-section-title { font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: rgba(38, 35, 32, 0.56); margin: 0 0 1.75rem; }
    .drink-card { text-align: center; height: 100%; }
    .drink-img-wrapper {
      width: min(100%, 220px); aspect-ratio: 1/1; margin: 0 auto; border-radius: 50%; overflow: hidden;
      background: #D4E9E2; transition: transform .25s ease;
    }
    .drink-card:hover .drink-img-wrapper { transform: scale(1.04); }
    .drink-img { width: 100%; height: 100%; object-fit: cover; }
    .drink-img[src$=".svg"] { object-fit: contain; padding: 12% 0 8%; }
    .drink-info { padding: 1rem .5rem 0; }
    .drink-name { font-weight: 700; font-size: 1.05rem; color: rgba(0,0,0,.87); line-height: 1.3; margin-bottom: .25rem; }
    .drink-price { font-weight: 600; color: #00754A; margin-top: .35rem; }
    .drink-detail { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Sub-header sticky: judul + tab kategori, aktif = garis hijau bawah */
    .menu-subnav { position: sticky; top: 99px; z-index: 50; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 2px 2px rgba(0,0,0,.06); }
    .menu-subnav__inner { padding: 1.25rem 40px 0; }
    .menu-subnav__title { font-size: 1.6rem; font-weight: 600; margin: 0 0 .75rem; }
    .category-filter-container { display: flex; gap: 1.75rem; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .category-filter-container::-webkit-scrollbar { display: none; }
    .category-btn {
      border: 0; background: none; padding: .35rem 0 .7rem; font-size: 0.95rem; font-weight: 400;
      color: rgba(0,0,0,.5); border-bottom: 4px solid transparent; transition: color .2s, border-color .2s;
    }
    .category-btn:hover { color: rgba(0,0,0,.87); }
    .category-btn.active { color: rgba(0,0,0,.87); font-weight: 600; border-bottom-color: #00754A; }
    @media (max-width: 1199px) { .menu-subnav { top: 72px; } }
    @media (max-width: 575px) {
      .menu-subnav__inner { padding: 1rem 16px 0; }
      .menu-subnav__title { font-size: 1.3rem; }
      .category-filter-container { gap: 1.25rem; }
      .drink-name { font-size: .95rem; }
    }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

  <!-- Header/Navbar -->
  <header id="navbar-placeholder"></header>
  <div id="navbar-spacer"></div>

  <!-- Sub-header menu: judul + tab kategori (sticky di bawah navbar) -->
  <div class="menu-subnav">
    <div class="menu-subnav__inner">
      <h1 class="menu-subnav__title">Menu Minuman</h1>
      <div class="category-filter-container" role="tablist">
        <button class="category-btn active" onclick="changeCategory(this, 'Tea')">Tea</button>
        <button class="category-btn" onclick="changeCategory(this, 'Chocolate')">Chocolate</button>
        <button class="category-btn" onclick="changeCategory(this, 'Milk')">Milk</button>
        <button class="category-btn" onclick="changeCategory(this, 'Coffee')">Coffee</button>
        <button class="category-btn" onclick="changeCategory(this, 'All')">Semua</button>
      </div>
    </div>
  </div>

  <main class="menu-main">
    <h2 class="menu-section-title" id="menu-section-title">Tea</h2>
    <!-- Grid Minuman -->
    <div class="row g-4 g-md-5" id="drinks-container">
      <!-- Loading State -->
      <div class="col-6 col-md-4 col-lg-3">
        <div class="drink-card p-2 border-0">
          <div class="drink-img-wrapper rounded-4 skeleton"></div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="drink-card p-2 border-0">
          <div class="drink-img-wrapper rounded-4 skeleton"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="footer-placeholder"></footer>

  <!-- Scripts (Termasuk Lenis Smooth Scroll dari script.js) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js?v=43" defer></script>
  <script src="navbar.js?v=39" defer></script>
  <script src="footer.js?v=36" defer></script>

  <script>
    let allDrinks = [];

    async function loadDrinks() {
      const container = document.getElementById('drinks-container');
      try {
        const { data, error } = await sb.from('drinks').select('*').eq('is_active', true).order('created_at', { ascending: false });
        if (error) throw error;

        allDrinks = data || [];
        renderDrinks('Tea'); // default dibuka: kategori Tea
      } catch (err) {
        console.error('Error loading drinks:', err);
        container.innerHTML = `<div class="col-12 text-center text-danger">Gagal memuat menu. Silakan coba lagi nanti.</div>`;
      }
    }

    async function seedDefaultDrinksFrontend() {
      const defaultDrinks = [
        { name: 'Es Coklat Teiko Special', category: 'Chocolate', price: 'Rp 15.000', oz_size: '16 oz', image_url: './asset/hero3.png', detail: 'Paduan coklat pekat khas Belgia dengan susu segar dan krim manis yang lumer di mulut.', is_active: true },
        { name: 'Brown Sugar Boba Milk', category: 'Milk', price: 'Rp 18.000', oz_size: '16 oz', image_url: './asset/hero1.webp', detail: 'Susu segar lembut dipadukan dengan gula aren asli khas Teiko serta kenyalnya boba premium.', is_active: true },
        { name: 'Matcha Oat Latte', category: 'Tea', price: 'Rp 20.000', oz_size: '16 oz', image_url: './asset/hero1.webp', detail: 'Teh hijau Uji Matcha pilihan bergaya Jepang dengan susu oat yang gurih dan menyehatkan.', is_active: true },
        { name: 'Belgian Choco Cream', category: 'Chocolate', price: 'Rp 18.000', oz_size: '16 oz', image_url: './asset/hero3.png', detail: 'Cokelat Belgia autentik dengan lapisan krim kental bertekstur lembut dan rasa cokelat pekat.', is_active: true },
        { name: 'Teiko Coffee Cream Special', category: 'Coffee', price: 'Rp 18.000', oz_size: '16 oz', image_url: './asset/hero1.webp', detail: 'Kopi espresso house-blend Teiko berpadu dengan susu kental lembut dan taburan bubuk kopi.', is_active: true },
        { name: 'Taro Creamy Milk', category: 'Milk', price: 'Rp 16.000', oz_size: '16 oz', image_url: './asset/hero3.png', detail: 'Aroma talas (taro) yang harum manis menyatu sempurna dengan susu krim kental khas Teiko.', is_active: true },
        { name: 'Jasmine Green Tea Original', category: 'Tea', price: 'Rp 10.000', oz_size: '22 oz', image_url: './asset/hero1.webp', detail: 'Teh melati seduh segar alami yang harum, ringan, dan sangat menyegarkan untuk setiap waktu.', is_active: true },
        { name: 'Caramel Macchiato Teiko', category: 'Coffee', price: 'Rp 20.000', oz_size: '16 oz', image_url: './asset/hero3.png', detail: 'Espresso kaya rasa dengan sirup karamel legit dan lapisan busa susu yang lembut.', is_active: true }
      ];
      try {
        await sb.from('drinks').insert(defaultDrinks);
        loadDrinks();
      } catch (e) {
        console.error('Auto seed drinks error:', e);
      }
    }

    // staggerAnimate ada di script.js (dipakai bareng halaman lain)

    function renderDrinks(category) {
      const container = document.getElementById('drinks-container');
      let filtered = allDrinks;

      if (category !== 'All') {
        filtered = allDrinks.filter(drink => {
          if (drink.category && drink.category.toLowerCase() === category.toLowerCase()) return true;
          return drink.name.toLowerCase().includes(category.toLowerCase());
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Menu untuk kategori ini belum tersedia.</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(drink => `
        <div class="col-6 col-md-4 anim-item">
          <div class="drink-card">
            <div class="drink-img-wrapper">
              <img src="${drink.image_url || './asset/hero1.webp'}" alt="${drink.name} - Teiko Bali" class="drink-img" loading="lazy">
            </div>
            <div class="drink-info text-center">
              <div class="drink-name">${drink.name}</div>
              ${drink.price ? `<div class="drink-price">${drink.price}</div>` : ''}
              ${drink.detail ? `<div class="drink-detail mt-2 text-muted" style="font-size: 0.85rem; line-height: 1.4;">${drink.detail.replace(/\n/g, '<br>')}</div>` : ''}
            </div>
          </div>
        </div>
      `).join('');

      // Stagger animate cards
      staggerAnimate('#drinks-container .anim-item', 60, 70);
    }

    function changeCategory(btn, category) {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('menu-section-title').textContent = category === 'All' ? 'Semua Minuman' : category;
      renderDrinks(category);
    }

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('page-loaded'));
      // Animate page title
      setTimeout(() => document.querySelectorAll('.menu-section-title').forEach(el => {
        el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        el.style.opacity = '0'; el.style.transform = 'translateY(20px)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.opacity = '1'; el.style.transform = 'translateY(0)';
        }));
      }), 50);
      loadDrinks();
    });
  </script>
</body>

</html>
