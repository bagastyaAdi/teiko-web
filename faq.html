<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>FAQ — Teiko Indonesia</title>
  <link rel="icon" type="image/png" href="asset/favicon.png?v=2" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="navbar.css?v=37" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAFAFA;
      color: #111111;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    body.page-loaded {
      opacity: 1;
    }

    /* ===== HERO ===== */
    .faq-hero {
      background: transparent;
      padding: 36px 1.5rem 20px;
      text-align: center;
    }

    .faq-hero h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: #111;
      letter-spacing: -0.02em;
    }

    .faq-hero p {
      color: #6b7280;
      font-size: 1.02rem;
      max-width: 560px;
      margin: 0.5rem auto 0;
      line-height: 1.6;
      padding: 0 1.25rem;
    }

    /* ===== FAQ LIST ===== */
    .faq-section {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 1.5rem 60px;
    }

    .faq-item {
      background: #ffffff;
      border-radius: 14px;
      margin-bottom: 1rem;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.025);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .faq-item:hover {
      border-color: rgba(5, 78, 52, 0.3);
      box-shadow: 0 6px 22px rgba(5, 78, 52, 0.05);
    }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 1.25rem 1.5rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: #111;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .faq-question:hover {
      background: #f9fafb;
    }

    .faq-question.open {
      color: #054E34;
      background: #f8faf9;
    }

    .faq-icon {
      font-size: 1.15rem;
      transition: transform 0.3s ease;
      flex-shrink: 0;
      color: #054E34;
    }

    .faq-question.open .faq-icon {
      transform: rotate(45deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.2s;
      padding: 0 1.5rem;
      color: #4b5563;
      font-size: 0.96rem;
      line-height: 1.75;
    }

    .faq-answer.open {
      max-height: 400px;
      padding: 0.5rem 1.5rem 1.4rem;
    }

    .anim-item {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .anim-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== FAQ SHOWCASE ===== */
    .faq-show { max-width: 1240px; margin: 0 auto; padding: 1rem 1.5rem 5rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 3.5rem; align-items: start; }
    .faq-tab { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 1rem; width: 100%; text-align: left; background: transparent; border: none; border-bottom: 1px solid #ececec; padding: 1.75rem 1.5rem; border-radius: 0; cursor: pointer; transition: background 0.25s ease, border-radius 0.25s ease; color: inherit; font: inherit; }
    .faq-tab.is-active { background: #e6f2eb; border-radius: 18px; border-bottom-color: transparent; }
    .faq-tab__num { font-family: 'Rubik', sans-serif; font-size: 2.6rem; font-weight: 800; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #0b6b45; transition: color 0.25s ease; }
    .faq-tab.is-active .faq-tab__num { color: #0b6b45; }
    .faq-tab__title { display: block; font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: #111; margin-bottom: 0.4rem; line-height: 1.3; transition: color 0.25s ease; }
    .faq-tab.is-active .faq-tab__title { color: #0b6b45; }
    .faq-tab__teaser { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #555; font-size: 0.98rem; line-height: 1.6; }
    .faq-tab__detail { display: none; }

    .faq-show__panel { position: sticky; top: 110px; }
    .faq-panel__title { font-family: 'Rubik', sans-serif; font-size: clamp(1.8rem, 3.2vw, 2.8rem); font-weight: 900; text-transform: uppercase; line-height: 1.08; margin-bottom: 1.5rem; color: #111; }
    .faq-media { width: 100%; aspect-ratio: 16 / 10; border-radius: 22px; overflow: hidden; background: #0b6b45; box-shadow: 0 18px 40px rgba(0,0,0,0.1); display: flex; align-items: flex-end; justify-content: center; }
    .faq-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .faq-media--cups img { width: 30%; height: 86%; object-fit: contain; object-position: bottom; margin: 0 -0.5rem; }
    .faq-panel__answer { margin-top: 1.5rem; font-size: 1.05rem; line-height: 1.75; color: #333; }
    .faq-panel__answer a { color: #054E34; font-weight: 600; }
    .faq-fade { animation: faqFade 0.35s ease; }
    @keyframes faqFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 991px) {
      .faq-show { grid-template-columns: 1fr; gap: 0; padding-bottom: 3.5rem; }
      .faq-show__panel { display: none; }
      .faq-tab { grid-template-columns: 3.25rem minmax(0, 1fr); padding: 1.25rem 1rem; }
      .faq-tab__num { font-size: 2rem; }
      .faq-tab__title { font-size: 1.1rem; }
      .faq-tab.is-active .faq-tab__teaser { display: none; }
      .faq-tab.is-active .faq-tab__detail { display: block; }
      .faq-tab__detail .faq-media { margin-top: 0.75rem; border-radius: 16px; }
      .faq-tab__detail .faq-panel__answer { margin-top: 1rem; font-size: 0.98rem; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

  <header id="navbar-placeholder"></header>
  <div id="navbar-spacer"></div>

  <!-- Hero Header -->
  <div class="faq-hero anim-item">
    <h1>Pertanyaan Umum (FAQ)</h1>
    <p>Temukan jawaban lengkap mengenai produk Teiko, sistem kemitraan, lowongan kerja, dan layanan pelanggan kami.</p>
  </div>

  <!-- FAQ Section: daftar bernomor (kiri) + panel jawaban bergambar (kanan) -->
  <section class="faq-show">
    <div class="faq-show__list" id="faq-list" role="tablist"></div>
    <aside class="faq-show__panel" id="faq-panel" aria-live="polite"></aside>
  </section>

  <footer id="footer-placeholder"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>
  <script src="navbar.js?v=37" defer></script>
  <script src="footer.js" defer></script>

  <script>
    // staggerAnimate ada di script.js.

    // Fallback kalau DB kosong/gagal: FAQ bawaan website.
    const FAQ_DEFAULT = [
      { title: 'Apakah Teiko membuka kemitraan atau franchise?', subtitle: 'Saat ini kami belum membuka sistem kemitraan (franchise). Seluruh outlet Teiko dikelola langsung oleh tim manajemen pusat untuk menjaga kualitas dan cita rasa terbaik. Informasi resmi mengenai pembukaan kemitraan di masa mendatang hanya akan diumumkan melalui kanal resmi Teiko.' },
      { title: 'Bagaimana cara melamar pekerjaan atau bergabung dengan tim Teiko?', subtitle: 'Kami terus mencari talenta dan pekerja bersemangat untuk bergabung bersama keluarga besar Teiko! Kamu bisa mengirimkan CV dan surat lamaran terbaru kamu melalui email resmi kami ke support@teiko.co.id dengan subjek lamaran kerja.' },
      { title: 'Apakah seluruh minuman di Teiko menggunakan bahan segar dan berkualitas?', subtitle: 'Tentu! Setiap minuman teh, kopi, dan krim spesial di Teiko diracik menggunakan daun teh asli pilihan, biji kopi premium, serta susu dan bahan alami berkualitas tinggi.' },
      { title: 'Bagaimana cara menghubungi kontak resmi email Teiko sesuai keperluan?', subtitle: 'Kami memiliki 3 alamat email resmi sesuai fungsinya:\n• info@teiko.co.id : untuk informasi Broadcast & Media.\n• support@teiko.co.id : untuk proses Hiring, lowongan kerja & pengiriman CV.\n• sales@teiko.co.id : untuk komunikasi dengan distributor/reseller terkait stok, harga, atau promo.' },
    ];
    // Foto cadangan (gelas dari Slide Display) kalau FAQ belum punya foto sendiri.
    const FAQ_CUPS = ['./asset/cta-greenthai.webp', './asset/cta-strawberry.webp', './asset/cta-taro.webp'];

    const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Jawaban: escape, "\n" tertulis jadi baris baru, email jadi tautan.
    const fmtAnswer = t => esc(String(t || '').replace(/\\n/g, '\n'))
      .replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>')
      .replace(/\n/g, '<br>');
    const media = (f, i) => f.image_url
      ? `<div class="faq-media"><img src="${esc(f.image_url)}" alt="${esc(f.title)}" loading="lazy"></div>`
      : `<div class="faq-media faq-media--cups">${[0, 1, 2].map(k => `<img src="${FAQ_CUPS[(i + k) % 3]}" alt="" loading="lazy">`).join('')}</div>`;

    let faqData = [];
    let faqActive = -1;
    const isDesktop = () => window.matchMedia('(min-width: 992px)').matches;

    function showFaq(i) {
      if (i === faqActive) return;
      faqActive = i;
      document.querySelectorAll('.faq-tab').forEach((t, k) => {
        t.classList.toggle('is-active', k === i);
        t.setAttribute('aria-selected', k === i);
      });
      const f = faqData[i];
      document.getElementById('faq-panel').innerHTML = `
        <div class="faq-fade">
          <h2 class="faq-panel__title">${esc(f.title)}</h2>
          ${media(f, i)}
          <div class="faq-panel__answer">${fmtAnswer(f.subtitle)}</div>
        </div>`;
    }

    function renderFaq() {
      const list = document.getElementById('faq-list');
      list.innerHTML = faqData.map((f, i) => `
        <button class="faq-tab" role="tab" data-i="${i}">
          <span class="faq-tab__num">${String(i + 1).padStart(2, '0')}</span>
          <span>
            <span class="faq-tab__title">${esc(f.title)}</span>
            <span class="faq-tab__teaser">${esc(String(f.subtitle || '').replace(/\\n/g, ' '))}</span>
            <span class="faq-tab__detail">${media(f, i)}<span class="faq-panel__answer d-block">${fmtAnswer(f.subtitle)}</span></span>
          </span>
        </button>`).join('');
      list.querySelectorAll('.faq-tab').forEach(t => {
        const i = +t.dataset.i;
        // Desktop: hover langsung ganti panel. HP: tap buka/ganti item.
        t.addEventListener('mouseenter', () => { if (isDesktop()) showFaq(i); });
        t.addEventListener('focus', () => showFaq(i));
        t.addEventListener('click', () => showFaq(i));
      });
      showFaq(0);
    }

    async function loadFaqShowcase() {
      try {
        const { data, error } = await sb.from('site_content').select('*').eq('is_active', true).like('id', 'faq_%');
        if (error) throw error;
        faqData = (data && data.length) ? data.sort((a, b) => a.id.localeCompare(b.id)) : FAQ_DEFAULT;
      } catch (err) {
        console.error('Error loading FAQ:', err);
        faqData = FAQ_DEFAULT;
      }
      renderFaq();
    }

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('page-loaded'));
      setTimeout(() => staggerAnimate('.faq-hero', 80, 100), 50);
      loadFaqShowcase();
    });
  </script>
</body>

</html>
