<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>FAQ — Teiko Indonesia</title>
  <link rel="icon" type="image/png" href="asset/favicon.png?v=2" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="style.css?v=45" />
  <link rel="stylesheet" href="navbar.css?v=39" />
  <link rel="stylesheet" href="theme.css?v=14">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAFAFA;
      color: #111111;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    body.page-loaded {
      opacity: 1;
    }

    

    

    

    

    .faq-item {
      background: #ffffff;
      border-radius: 14px;
      margin-bottom: 1rem;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.025);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .faq-item:hover {
      border-color: rgba(30, 57, 50, 0.3);
      box-shadow: 0 6px 22px rgba(30, 57, 50, 0.05);
    }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 1.25rem 1.5rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: #111;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .faq-question:hover {
      background: #f9fafb;
    }

    .faq-question.open {
      color: #1E3932;
      background: #f8faf9;
    }

    .faq-icon {
      font-size: 1.15rem;
      transition: transform 0.3s ease;
      flex-shrink: 0;
      color: #1E3932;
    }

    .faq-question.open .faq-icon {
      transform: rotate(45deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.2s;
      padding: 0 1.5rem;
      color: #4b5563;
      font-size: 0.96rem;
      line-height: 1.75;
    }

    .faq-answer.open {
      max-height: 400px;
      padding: 0.5rem 1.5rem 1.4rem;
    }

    .anim-item {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .anim-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    
    
    
    
    
    
    
    
    

    
    
    
    
    
    
    
    
    @keyframes faqFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

  <header id="navbar-placeholder"></header>
  <div id="navbar-spacer"></div>

  <div class="page-subhead">
    <div class="page-subhead__inner"><h1 class="page-subhead__title">Pertanyaan Umum (FAQ)</h1></div>
  </div>

  <section class="sb-wrap faq-acc" id="faq-list"></section>
  <div class="faq-more">
    <p class="mb-3" style="color:rgba(0,0,0,.58);">Belum menemukan jawabannya?</p>
    <a class="sb-btn sb-btn--filled" href="feedback">Hubungi Customer Care</a>
  </div>

  <footer id="footer-placeholder"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js?v=45" defer></script>
  <script src="navbar.js?v=39" defer></script>
  <script src="footer.js?v=36" defer></script>

  <script>
    // staggerAnimate ada di script.js.

    // Fallback kalau DB kosong/gagal: FAQ bawaan website.
    const FAQ_DEFAULT = [
      { title: 'Apakah Teiko membuka kemitraan atau franchise?', subtitle: 'Saat ini kami belum membuka sistem kemitraan (franchise). Seluruh outlet Teiko dikelola langsung oleh tim manajemen pusat untuk menjaga kualitas dan cita rasa terbaik. Informasi resmi mengenai pembukaan kemitraan di masa mendatang hanya akan diumumkan melalui kanal resmi Teiko.' },
      { title: 'Bagaimana cara melamar pekerjaan atau bergabung dengan tim Teiko?', subtitle: 'Kami terus mencari talenta dan pekerja bersemangat untuk bergabung bersama keluarga besar Teiko! Kamu bisa mengirimkan CV dan surat lamaran terbaru kamu melalui email resmi kami ke support@teiko.co.id dengan subjek lamaran kerja.' },
      { title: 'Apakah seluruh minuman di Teiko menggunakan bahan segar dan berkualitas?', subtitle: 'Tentu! Setiap minuman teh, kopi, dan krim spesial di Teiko diracik menggunakan daun teh asli pilihan, biji kopi premium, serta susu dan bahan alami berkualitas tinggi.' },
      { title: 'Bagaimana cara menghubungi kontak resmi email Teiko sesuai keperluan?', subtitle: 'Kami memiliki 3 alamat email resmi sesuai fungsinya:\n• info@teiko.co.id : untuk informasi Broadcast & Media.\n• support@teiko.co.id : untuk proses Hiring, lowongan kerja & pengiriman CV.\n• sales@teiko.co.id : untuk komunikasi dengan distributor/reseller terkait stok, harga, atau promo.' },
    ];

    const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Jawaban: escape, "\n" tertulis jadi baris baru, email jadi tautan.
    const fmtAnswer = t => esc(String(t || '').replace(/\\n/g, '\n'))
      .replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>')
      .replace(/\n/g, '<br>');
    let faqData = [];

    // Akordeon native <details>: item pertama terbuka, foto (kalau ada) tampil di atas jawaban.
    function renderFaq() {
      document.getElementById('faq-list').innerHTML = faqData.map((f, i) => `
        <details${i === 0 ? ' open' : ''}>
          <summary>${esc(f.title)}</summary>
          <div class="faq-acc__body">
            ${f.image_url ? `<img src="${esc(f.image_url)}" alt="${esc(f.title)}" loading="lazy">` : ''}
            ${fmtAnswer(f.subtitle)}
          </div>
        </details>`).join('');
    }

    async function loadFaqShowcase() {
      try {
        const { data, error } = await sb.from('site_content').select('*').eq('is_active', true).like('id', 'faq_%');
        if (error) throw error;
        faqData = (data && data.length) ? data.sort((a, b) => a.id.localeCompare(b.id)) : FAQ_DEFAULT;
      } catch (err) {
        console.error('Error loading FAQ:', err);
        faqData = FAQ_DEFAULT;
      }
      renderFaq();
    }

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('page-loaded'));
            loadFaqShowcase();
    });
  </script>
</body>

</html>
