<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Berita - Teiko</title>

  <!-- SEO & Icons -->
  <link rel="icon" type="image/png" href="asset/favicon.png?v=2" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">

  <!-- GSAP & Lenis Smooth Scrolling -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <style>
    /* ===== PAGE TRANSITION ===== */
    body {
      background-color: #fcfcfc;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.page-loaded { opacity: 1; }

    .news-detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #666;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      margin-bottom: 24px;
    }
    .news-detail-back:hover { color: #111; }

    .news-detail-row {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: flex-start;
    }

    .news-detail-imgwrap {
      flex: 1 1 380px;
      max-width: 460px;
      background: #f5f5f5;
      border-radius: 16px;
      overflow: hidden;
    }

    .news-detail-img {
      width: 100%;
      height: auto;
      max-height: 640px;
      object-fit: contain;
      display: block;
    }

    .news-detail-body {
      flex: 1 1 320px;
    }

    .news-detail-title {
      font-weight: 800;
      margin-bottom: 20px;
    }

    .news-detail-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #333;
      white-space: pre-line;
    }

    .skeleton {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 16px;
      height: 300px;
      width: 100%;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>
<body>

  <!-- Navbar Placeholder -->
  <header id="navbar-placeholder"></header>
  <div id="navbar-spacer"></div>

  <main class="container mb-5" style="max-width: 980px; padding-top: 40px;">
    <a href="index.html#news-section" class="news-detail-back">
      <i class="bi bi-arrow-left"></i> Kembali ke Beranda
    </a>

    <div id="news-detail-content">
      <div class="skeleton"></div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="footer-placeholder"></footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>
  <script src="navbar.js" defer></script>
  <script src="footer.js" defer></script>

  <script>
    async function loadNewsDetail() {
      const container = document.getElementById('news-detail-content');
      const id = new URLSearchParams(window.location.search).get('id');

      if (!id) {
        container.innerHTML = `<p class="text-muted">Berita tidak ditemukan.</p>`;
        return;
      }

      try {
        const { data, error } = await sb.from('site_content').select('*').eq('id', id).single();
        if (error || !data) throw error || new Error('not found');

        document.title = `${data.title || 'Berita'} - Teiko`;
        const body = `
          <h1 class="news-detail-title h2">${data.title || ''}</h1>
          ${data.subtitle ? `<p class="news-detail-text">${data.subtitle.replace(/</g, '&lt;')}</p>` : ''}
        `;
        container.innerHTML = data.image_url ? `
          <div class="news-detail-row">
            <div class="news-detail-imgwrap">
              <img src="${data.image_url}" alt="${data.title || ''}" class="news-detail-img">
            </div>
            <div class="news-detail-body">${body}</div>
          </div>
        ` : body;
      } catch (err) {
        console.error('Gagal memuat berita:', err);
        container.innerHTML = `<p class="text-muted">Berita tidak ditemukan atau sudah dihapus.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('page-loaded'));
      loadNewsDetail();
    });
  </script>
</body>
</html>
