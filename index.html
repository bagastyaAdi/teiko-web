<head>

  <!-- Favicon -->

  <meta property="og:description" content="Teiko - Minuman teh dan kopi dengan rasa khas, harga ramah dan kualitas premium. Outlet tersebar di Denpasar, Bali.">

  <meta property="og:url" content="https://teiko.co.id/">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Structured Data: LocalBusiness -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Jl. Sunia Negara No.31, Pemogan",

      "postalCode": "80221",
      "addressCountry": "ID"
    },
    "servesCuisine": "Tea & Coffee",
    "priceRange": "$$"
  }
  </script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=35">
  <link rel="stylesheet" href="navbar.css?v=35">

  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body>
  <!-- Header/Navbar -->
  <header id="navbar-placeholder"></header>
  <div id="navbar-spacer"></div>

  <main>
    <!-- ===== PRODUCT-CENTRIC HERO ===== -->
    <section id="hero1-section" class="hero-product">
      <div class="hero-product__inner">

        <!-- Header: Eyebrow + Title + Description -->
        <div class="hero-product__header">
          <div class="hero-product__eyebrow" id="hero1-eyebrow">"Pendatang baru, langsung nomor satu.</div>
          <h1 class="hero-product__title" id="hero1-title">NEW MENU ES COKLAT</h1>
          <p class="hero-product__desc" id="hero1-subtitle" style="display: none;"></p>
        </div>

        <!-- Body: Quote | Product Image | Tags -->
        <div class="hero-product__body">

          <!-- LEFT: Quote + Reviews -->
          <!-- LEFT: Quote Text -->
          <div class="hero-product__quote">
            <div class="hero-product__quote-icon">❝</div>
            <div class="hero-product__quote-text" id="hero1-quote">Rasanya Enak Banget, Bikin Nagih! Teiko Emang Paling Pas Buat Setiap Momen.</div>
          </div>

          <!-- CENTER: Product Cup PNG -->
          <div class="hero-product__image-wrap">
            <img id="es-coklat-cup-img" src="./asset/hero3.png" alt="Es Coklat Teiko Cup" class="hero-product__image" fetchpriority="high" loading="eager" decoding="async" width="378" height="472" />
            <!-- CAROUSEL DOTS: Perfectly centered under the drink cup -->
            <div class="hero-product__dots hero-carousel-dots" id="hero-carousel-dots"></div>
          </div>

          <!-- RIGHT: Spacer/Tags -->
          <div class="hero-product__tags" id="hero1-tags-area"></div>

          <!-- FOOTER BAR: Always Side-by-Side (Menyamping) -> 10 Outlet (Left) & Follow Us On (Right) -->
          <div class="hero-product__footer-bar">
            <div class="hero-product__review">
              <div class="hero-product__review-avatars">
                <span>T</span><span>E</span><span>I</span>
              </div>
              <div class="hero-product__review-info">
                <strong>10 Outlet</strong>
                <small>Tersebar di Daerah Kota Denpasar</small>
              </div>
            </div>

            <div class="hero-product__social">
              <div class="hero-product__social-label">Follow Us On</div>
              <div class="hero-product__social-icons">
                <a href="https://www.instagram.com/te.ko_official" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="https://www.tiktok.com/@teiko.official" target="_blank" title="TikTok"><i class="bi bi-tiktok"></i></a>
                <a href="https://api.whatsapp.com/send/?phone=6282111312779" target="_blank" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
              </div>
            </div>
          </div>

        </div>

        <!-- CTA Buttons (Hidden for clean visual) -->
        <div class="hero-product__actions" style="display: none;">
          <a id="hero1-btn" href="drinks" class="btn-editorial" aria-label="Lihat Menu Teiko">Lihat Menu Kami <i class="bi bi-arrow-right"></i></a>
          <a id="hero1-btn2" href="https://api.whatsapp.com/send/?phone=6282111312779&text=Halo%20Teiko" target="_blank" class="btn-editorial-outline" aria-label="Order Partai Besar">Order Partai Besar <i class="bi bi-whatsapp"></i></a>
        </div>

        <!-- Carousel Slide Dots -->
        <div class="hero-product__dots" id="hero-carousel-dots" style="display: none;">
          <button class="hero-dot active" data-slide="0" aria-label="Slide 1"></button>
          <button class="hero-dot" data-slide="1" aria-label="Slide 2"></button>
          <button class="hero-dot" data-slide="2" aria-label="Slide 3"></button>
        </div>

      </div>
    </section>

    <!-- ===== FULL-WIDTH PROMOTIONAL BANNERS CAROUSEL (CMS: hero1, hero2, hero3) ===== -->
    <section id="fullwidth-hero-banner-section" class="fullwidth-banner-section">
      <div class="fullwidth-banner-track">
        <a id="hero-banner-link" href="javascript:void(0)" class="fullwidth-banner-link">
          <img id="hero-banner-img" src="./asset/hero1.webp" alt="Teiko Promo Banner" class="fullwidth-banner-img" loading="eager" decoding="async" width="721" height="286" />
          <img id="hero-banner-img-overlay" src="" alt="" class="fullwidth-banner-img fullwidth-banner-img--overlay" aria-hidden="true" decoding="async" width="721" height="286" />
        </a>
      </div>
      <!-- Dots for fullwidth banner -->
      <div class="fullwidth-banner-dots" id="fullwidth-banner-dots">
        <button class="banner-dot active" data-slide="0" aria-label="Slide 1"></button>
        <button class="banner-dot" data-slide="1" aria-label="Slide 2"></button>
        <button class="banner-dot" data-slide="2" aria-label="Slide 3"></button>
      </div>
    </section>

    <section id="promo-2box-section" class="promo-2box-section">
      <div class="promo-2box-grid">
        <!-- BOX 1 -->
        <a href="drinks" class="promo-box-card" id="promo-box-1-link" style="display:none;">
          <div class="promo-box-img-wrap">
            <img id="promo-box-1-img" src="" alt="Promo Teiko 1" class="promo-box-img" loading="lazy" />
          </div>
        </a>

        <!-- BOX 2 -->
        <a href="drinks" class="promo-box-card" id="promo-box-2-link" style="display:none;">
          <div class="promo-box-img-wrap">
            <img id="promo-box-2-img" src="" alt="Promo Teiko 2" class="promo-box-img" loading="lazy" />
          </div>
        </a>

        <!-- BOX 3 -->
        <a href="drinks" class="promo-box-card" id="promo-box-3-link" style="display:none;">
          <div class="promo-box-img-wrap">
            <img id="promo-box-3-img" src="" alt="Promo Teiko 3" class="promo-box-img" loading="lazy" />
          </div>
        </a>

        <!-- BOX 4 -->
        <a href="drinks" class="promo-box-card" id="promo-box-4-link" style="display:none;">
          <div class="promo-box-img-wrap">
            <img id="promo-box-4-img" src="" alt="Promo Teiko 4" class="promo-box-img" loading="lazy" />
          </div>
        </a>
      </div>
    </section>

    <!-- ===== NEWS (CMS: site_content, id "news_*") ===== -->
    <section id="news-section" class="news-section" style="display:none;">
      <div class="news-section__inner">
        <h2 class="news-section__heading">Info &amp; Update Terbaru</h2>
        <div id="news-grid" class="news-grid"></div>
      </div>
    </section>
